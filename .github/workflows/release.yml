name: Release

on:
  push:
    tags:
      - 'v*' # Triggers on any tag starting with 'v' (e.g., v0.25, v1.0.0, v1.0.0-alpha.1)

jobs:
  build:
    name: Build & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux System Dependencies, Clang, Ninja & Vulkan
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libvulkan-dev

      - name: Setup MSYS2 / MinGW-w64 & Ninja (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-vulkan-headers
            mingw-w64-x86_64-vulkan-loader
            zip

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DFLUXION_VERSION=${{ github.ref_name }}

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DFLUXION_VERSION=${{ github.ref_name }}

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFLUXION_VERSION=${{ github.ref_name }}

      - name: Build Application (Unix)
        if: runner.os != 'Windows'
        run: cmake --build build

      - name: Build Application (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build build

      - name: Set Archive Filename
        id: archive-name
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            echo "ARCHIVE_NAME=fluxion-${VERSION}-windows-x86_64.zip" >> $GITHUB_ENV
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            echo "ARCHIVE_NAME=fluxion-${VERSION}-macos.zip" >> $GITHUB_ENV
          else
            echo "ARCHIVE_NAME=fluxion-${VERSION}-linux-x86_64.tar.gz" >> $GITHUB_ENV
          fi

      - name: Create Staging Directory & Package (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p staging/fluxion
          
          # Copy executable, dynamic libraries, assets, and plugins
          cp build/bin/fluxion.exe staging/fluxion/
          cp build/bin/*.dll staging/fluxion/ 2>/dev/null || true
          cp -r build/bin/assets staging/fluxion/ 2>/dev/null || true
          if [ -d "build/bin/plugins" ]; then
            cp -r build/bin/plugins staging/fluxion/
          fi
          
          cd staging
          zip -r ../${{ env.ARCHIVE_NAME }} fluxion
          cd ..

      - name: Create Staging Directory & Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p staging/fluxion
          
          if [ "${{ matrix.os }}" == "macos-latest" ]; then
            cp -r build/bin/Fluxion.app staging/fluxion/
            if [ -d "build/bin/plugins" ]; then
              cp -r build/bin/plugins staging/fluxion/
            fi
            cd staging/fluxion
            zip -r ../../${{ env.ARCHIVE_NAME }} .
            cd ../..
          else
            cp build/bin/fluxion staging/fluxion/
            
            cp build/bin/*.so staging/fluxion/ 2>/dev/null || true
            cp build/bin/*.so.* staging/fluxion/ 2>/dev/null || true
            
            cp -r build/bin/assets staging/fluxion/
            if [ -d "build/bin/plugins" ]; then
              cp -r build/bin/plugins staging/fluxion/
            fi
            cd staging/fluxion
            tar -czf ../../${{ env.ARCHIVE_NAME }} .
            cd ../..
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create release and upload assets
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
